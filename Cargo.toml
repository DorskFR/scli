[package]
name = "scli"
version = "0.6.7"
edition = "2021"
description = "Slack CLI for coding agents: one static binary, one user token, one TAB-separated record per line."
license = "MIT"

[dependencies]
anstream = "0.6"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "color", "suggestions", "wrap_help"] }
clap_complete = "4"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "native-certs"] }

[profile.release]
lto = true
strip = true
